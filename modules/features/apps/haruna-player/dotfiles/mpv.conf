# Hardware Acceleration
hwdec=auto-safe
vo=gpu-next
gpu-api=auto

# Presets Kualitas Gambar
profile=high-quality
scale=eawa_lanczos
cscale=eawa_lanczos

# Perbaikan Kualitas & Pemutaran
dither-depth=auto
deband=yes
video-sync=display-resample
interpolation=yes
tscale=oversample

# Audio & Subtitle Defaults
alang=ind,id,eng,en
slang=ind,id,eng,en
sub-auto=fuzzy
sub-font="Sans Serif"
sub-font-size=42
sub-bold=yes
