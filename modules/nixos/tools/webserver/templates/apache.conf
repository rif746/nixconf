Listen 443 https
DefaultRuntimeDir "/run/httpd"
SSLCertificateFile @certDir@/certs/localhost.crt
SSLCertificateKeyFile @certDir@/certs/localhost.key

# Explicitly allow Apache to access the user home root directory
<Directory "/home/@userName@">
    Options Indexes FollowSymLinks ExecCGI
    AllowOverride All
    Require all granted
</Directory>

Alias /403.html /var/www/default/403.html
Alias /500.html /var/www/default/500.html
Alias /503.html /var/www/default/503.html

ErrorDocument 403 /403.html
ErrorDocument 500 /500.html
ErrorDocument 503 /503.html

# Default Fallback VHost (HTTP - Port 80)
<VirtualHost *:80>
    ServerName default.test
    ServerAlias localhost 127.0.0.1
    DocumentRoot "/var/www/default"

    <Directory "/var/www/default">
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

# Default Fallback VHost (HTTPS - Port 443)
<VirtualHost *:443>
    ServerName default.test

    SSLEngine on
    SSLCertificateFile @certDir@/certs/localhost.crt
    SSLCertificateKeyFile @certDir@/certs/localhost.key

    DocumentRoot "/var/www/default"

    <Directory "/var/www/default">
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

# Mailpit SSL Reverse Proxy
<VirtualHost *:443>
    ServerName @mailpitDomain@

    SSLEngine on
    SSLCertificateFile @certDir@/certs/mailpit.crt
    SSLCertificateKeyFile @certDir@/certs/mailpit.key

    ProxyPreserveHost Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8025/$1 [P,L]

    ProxyPass / http://127.0.0.1:8025/ retry=0 timeout=5
    ProxyPassReverse / http://127.0.0.1:8025/

    SSLProxyEngine Off

    <Location />
        Require all granted
    </Location>
</VirtualHost>

<Directory "/var/www">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

IncludeOptional /var/lib/apache-vhosts/*.conf
